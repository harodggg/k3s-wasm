# overlays/shim-only —— 默认部署路径：只依赖 containerd wasm shim，不需要 SpinKube。
#
# 控制台后端是一个标准 wasi:http/proxy 组件（导出 wasi:http/incoming-handler，
# 没有任何 spin:* 导入），所以它跑在 **wasmtime** 运行时上，而不是 spin 运行时：
# runwasi 的 wasmtime shim 按导出名自动识别这类组件，并在容器内监听 8080。
#
# 装法：
#   ./scripts/install-wasm-runtime.sh            # 节点侧：装 shim + 配置 + 打标签
#   ./scripts/build-ui.sh --import               # 构建并导入镜像
#   kubectl apply -k deploy/overlays/shim-only
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k3s-wasm

resources:
  - ../../base
  - ui-deployment.yaml
  # 浏览器直连入口（NodePort 30081）。不需要的话删掉这一行即可。
  - ui-nodeport.yaml

images:
  # 用完全限定名：kubelet 会把短名规范化成 docker.io/...，
  # 导入本地镜像（k3s ctr -n k8s.io images import）时如果用的是短名，
  # CRI 会因为名字对不上而尝试真拉取，报 pull access denied。
  - name: k3s-wasm/k3s-wasm-ui
    newName: docker.io/k3s-wasm/k3s-wasm-ui
    newTag: dev
