# 控制台的 NodePort 入口。
#
# 为什么用 NodePort 而不是 Ingress：
#   本仓库在真机上验证过（k3s v1.36 + Cilium 1.20 + kube-proxy 替换）：
#   k3s 自带的 servicelb（klipper-lb）是靠 hostPort 实现 LoadBalancer 的，
#   而 kube-proxy 被 Cilium 替换后 hostPort 不再由 kube-proxy 处理，
#   结果就是 Traefik 的 Service 拿到了 EXTERNAL-IP，但节点 80/443 **根本没在监听**。
#   NodePort 则由 Cilium 在 BPF 里实现，实测正常。
#   （给 Cilium 打开 hostPort.enabled 在本环境里也没能救活 servicelb，所以不推荐依赖它。）
#
# 需要 Ingress 的场景：把 Traefik 改成 hostNetwork 并让它直接监听 80/443，
# 或者用别的 ingress controller —— 见 docs/05-k3s-cilium.md。
apiVersion: v1
kind: Service
metadata:
  name: k3s-wasm-ui-nodeport
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/name: k3s-wasm-ui
    app.kubernetes.io/part-of: k3s-wasm
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: k3s-wasm-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      # 30081 只是默认值；30080 留给 Hubble UI（见 install-k3s-cilium.sh）
      nodePort: 30081
