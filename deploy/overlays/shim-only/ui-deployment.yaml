# 控制台自身的工作负载：一个 wasm32-wasip2 组件，直接由 containerd 的 wasmtime shim 承载。
#
# 几个容易踩的点，都写在配置里了：
#   1. runtimeClassName 是 wasmtime-wasip2（handler wasmtime），不是 spin 系。
#   2. wasmtime shim 在容器网络命名空间里监听 **8080**（可用
#      WASMTIME_HTTP_PROXY_SOCKET_ADDR 覆盖），不是 Spin 的 80。
#   3. K8S_PROXY_URL 走的是容器 env。runwasi 的 wasmtime shim 会把容器 env 传给 guest
#      （它调 wasmtime 的 .envs()），所以组件里的 wasi:cli/environment 能读到。
#   4. 探针直接打 /api/health：组件会真的去问 kube-api-proxy，所以它能顺带证明
#      「组件 → 代理 → API Server」这条链路是通的，比 TCP 探针有意义得多。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-wasm-ui
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/name: k3s-wasm-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-wasm-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-wasm-ui
        app.kubernetes.io/part-of: k3s-wasm
    spec:
      runtimeClassName: wasmtime-wasip2
      serviceAccountName: k3s-wasm-ui
      containers:
        - name: ui
          image: docker.io/k3s-wasm/k3s-wasm-ui:v0.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # 必须用 IP，不能用 Service 的 DNS 名：wasmtime shim 不给 guest 域名解析能力，
            # 用域名会让出站请求永久挂住（实测无报错、只是超时）。详见
            # deploy/base/kube-api-proxy.yaml 里的说明与 docs/04-troubleshooting.md。
            - name: K8S_PROXY_URL
              value: http://10.43.0.53:8001
            # 该 IP 与 kube-api-proxy Service 的 spec.clusterIP 必须一致。
            #
            # ── 免密登录（WebAuthn / Touch ID）─────────────────────────
            # 会话 cookie 的签名密钥。**没有它控制台会拒绝服务（503）而不是放行** ——
            # 这个组件手里是 kube-api-proxy 的权限，配置不全时放行等于把集群交出去。
            # 生成：openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
            - name: K3S_WASM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: k3s-wasm-ui-auth-env
                  key: sessionSecret
            # 首次绑定 Touch ID 用的一次性注册码；绑定成功后即失效。
            - name: K3S_WASM_REGISTRATION_CODE
              valueFrom:
                secretKeyRef:
                  name: k3s-wasm-ui-auth-env
                  key: registrationCode
                  optional: true
            # WebAuthn 的 RP ID 与 origin：必须与浏览器地址栏里的一致，否则
            # rpIdHash / origin 校验不过（现象是「登录时找不到凭据」或 401）。
            # 不填则从请求的 Host 头推导（见 auth.rs 的 effective_rp）。
            - name: K3S_WASM_RP_ID
              value: console.2.29.44.63.nip.io
            - name: K3S_WASM_ORIGIN
              value: https://console.2.29.44.63.nip.io
            # 公钥凭据存放的 Secret 名（由控制台自己写入；与上面的 env Secret 分开，
            # 免得凭据 JSON 被当成环境变量注入）。
            - name: K3S_WASM_AUTH_SECRET
              value: k3s-wasm-ui-auth
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
