# base = 与「用哪种方式跑控制台」无关的公共部分。
# 具体把控制台跑成 Deployment（shim-only）还是 SpinApp（SpinKube），见 overlays/。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - runtimeclass-spin.yaml
  - runtimeclass-wasmtime.yaml
  - kube-api-proxy.yaml
  - ui-service.yaml
  # 控制台对外入口（HTTPS + Let's Encrypt；host 换成你自己的域名时见文件头注释）
  - ui-ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: k3s-wasm
