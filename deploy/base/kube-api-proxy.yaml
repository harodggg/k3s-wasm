# ─────────────────────────────────────────────────────────────────────
# kube-api-proxy —— 让 wasm 组件用「明文 HTTP」访问 Kubernetes API。
#
# 为什么需要它（这是个刻意做的取舍，不是偷懒）：
#   wasm32-wasip2 组件里的出站 HTTPS 由宿主（Spin shim 内的 Spin 运行时 /
#   wasmtime + wasi:http）完成 TLS。k3s 默认给 API Server 签的是**集群自签 CA**，
#   而宿主的信任根不在我们手里配置，于是直连 https://kubernetes.default.svc
#   会遇到证书校验失败，且几乎没有可用的出口去注入自定义 CA。
#
#   所以这里放一个 kubectl proxy：它用 Pod 的 ServiceAccount 去和 API Server 做
#   带认证的 TLS，对集群内暴露一个**明文 HTTP** 端点。wasm 组件只讲 HTTP，
#   把 TLS/证书/Token 全部留在组件之外 —— 这也正好符合 wasm 的能力最小化思路。
#
# 安全边界（务必读）：
#   1. 这个 Service 在集群内是**无认证**的，谁能访问它，谁就拥有下面 ClusterRole
#      里的全部权限（等于一个集群管理员入口）。
#   2. 因此下面配套了 NetworkPolicy，只允许控制台 Pod 访问它。
#      k3s 自带 network policy controller，NetworkPolicy 是生效的。
#   3. 不需要它的话，把本文件从 kustomization.yaml 里去掉，并给控制台设置
#      K8S_DIRECT=1 + KUBE_TOKEN/KUBE_CA_CERT（见 docs/02-ui.md 的「直连模式」）。
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-api-proxy
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/name: kube-api-proxy
    app.kubernetes.io/part-of: k3s-wasm
---
# 控制台要展示/操作的东西，全部在这里显式列出。
# 权限给的是「运维控制台」的量级：能看能改工作负载，但不碰 secret 内容。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-wasm-console
  labels:
    app.kubernetes.io/part-of: k3s-wasm
rules:
  # 概览：节点与命名空间
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  # 工作负载视图 + 日志
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # 扩缩容与下发
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  # 创建/删除 xray 隧道这类工作负载
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "patch", "delete"]
  # 控制台的「Xray 隧道」会顺带建 NetworkPolicy（认证管谁能用，它管谁能连）
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # 网络拓扑要画 Ingress → Service 的边，所以需要只读 Ingress。
  # 没有这条也能跑：`/api/topology` 把 Ingress 当**可选**资源，读不到就把原因写进
  # 响应的 notes（前端会显示），图里少一列但不会整体失败。
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # RuntimeClass 列表（控制台要显示哪些 wasm 运行时可用）
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  # SpinKube 的 SpinApp CRD（装了 SpinKube 才有；没装时这几条规则无副作用）
  - apiGroups: ["core.spinkube.dev"]
    resources: ["spinapps", "spinappexecutors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 控制台的「Xray 隧道」功能需要把隧道凭据写进 Secret（上游明确要求凭据走 Secret）。
  #
  # ⚠️ 这是一个**有实权的**权限：patch 一个已存在的 Secret 会返回其内容，
  #    所以「patch secrets」实际上等价于「读该 Secret」。取舍如下：
  #      · 需要控制台代建 Secret  → 保留下面这段；
  #      · 想收紧                → 删掉它，自己预先建好 Secret，
  #        并在控制台表单里填「已有 Secret 名称」（那条路径只引用、不创建）。
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-wasm-console
  labels:
    app.kubernetes.io/part-of: k3s-wasm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-wasm-console
subjects:
  - kind: ServiceAccount
    name: kube-api-proxy
    namespace: k3s-wasm
---
# 控制台要「展示 vless 链接」就得读该隧道自己的 Secret（XT_UUID/XT_PBK…）。
# 这里刻意**不用集群级 `get secrets`**（那等于能读全集群密钥），
# 而是在隧道所在命名空间里给一个 Role —— 只覆盖这些命名空间。
# 在别的命名空间建隧道时，请把这份 Role/RoleBinding 复制过去。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k3s-wasm-tunnel-secrets
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/part-of: k3s-wasm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k3s-wasm-tunnel-secrets
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/part-of: k3s-wasm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k3s-wasm-tunnel-secrets
subjects:
  - kind: ServiceAccount
    name: kube-api-proxy
    namespace: k3s-wasm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-api-proxy
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/name: kube-api-proxy
    app.kubernetes.io/part-of: k3s-wasm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-api-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-api-proxy
        app.kubernetes.io/part-of: k3s-wasm
    spec:
      serviceAccountName: kube-api-proxy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          # 官方镜像，多架构。版本只影响 kubectl 自身，不必与集群版本严格一致。
          image: registry.k8s.io/kubectl:v1.33.0
          args:
            - proxy
            - --address=0.0.0.0
            - --port=8001
            - --accept-hosts=.*
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-api-proxy
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/name: kube-api-proxy
    app.kubernetes.io/part-of: k3s-wasm
spec:
  type: ClusterIP
  # ⚠️ 这里**固定**了 ClusterIP，不是随意写的。原因很硬：
  #   wasmtime shim 不向 wasm guest 提供域名解析（wasi:sockets/ip-name-lookup 没开）。
  #   组件若用 DNS 名（kube-api-proxy.k3s-wasm.svc.cluster.local）访问，
  #   出站请求会**永久挂住**（实测 60s 超时且没有任何报错），而用 IP 直连 0.7s 就返回。
  #   集群自身的 DNS 是好的（普通 Pod 能解析）—— 这是 guest 侧能力缺失。
  #   所以这里把 ClusterIP 钉死，让组件可以写死一个稳定的 IP。
  #
  #   10.43.0.53 必须在 k3s 的 service CIDR 内且空闲（k3s 默认 10.43.0.0/16）。
  #   如果你的集群用了别的 service CIDR：改这个值，并同步改
  #   deploy/overlays/shim-only/ui-deployment.yaml 里的 K8S_PROXY_URL。
  clusterIP: 10.43.0.53
  selector:
    app.kubernetes.io/name: kube-api-proxy
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# 只允许控制台 Pod 进 8001。这是上面「安全边界」第 2 条的具体手段。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-api-proxy-lockdown
  namespace: k3s-wasm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-api-proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: k3s-wasm-ui
      ports:
        - protocol: TCP
          port: 8001
