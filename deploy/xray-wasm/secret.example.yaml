# 示例而已，别把真凭据提交进仓库。
# 用命令创建更安全：
#   kubectl -n xray create secret generic xray-wasm --from-literal=XT_SERVER=... ...
apiVersion: v1
kind: Secret
metadata:
  name: xray-wasm
  namespace: xray
type: Opaque
stringData:
  XT_SERVER: "<服务端 ip:port>"
  XT_UUID: "<uuid>"
  XT_PBK: "<REALITY 公钥 base64url>"
  XT_SID: "<shortId hex>"
  XT_SNI: "<伪装域名>"
  # 共享代理模式下这两个不是可选项
  XT_SOCKS_USER: "<代理用户名>"
  XT_SOCKS_PASS: "<代理密码>"
  # 若服务端限制了客户端版本区间，按需覆盖（默认 26.3.27）
  # XT_CLIENT_VER: "26.3.27"
