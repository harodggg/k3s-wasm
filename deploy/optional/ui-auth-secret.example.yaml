# 控制台免密登录需要的环境变量 Secret（**示例，不要直接提交真实值**）。
#
# 生成并创建（推荐直接跑命令，别手写 yaml）：
#
#   SESSION=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
#   CODE=$(openssl rand -hex 16)
#   kubectl -n k3s-wasm create secret generic k3s-wasm-ui-auth-env \
#     --from-literal=sessionSecret="$SESSION" \
#     --from-literal=registrationCode="$CODE"
#   echo "一次性注册码：$CODE"      # 打开控制台绑定 Touch ID 时填它
#
# 说明：
#   * `sessionSecret` 是会话 cookie 的 HMAC 密钥，**必须存在**（至少 16 字节）。
#     它是 base64url（无 padding）编码的随机串 —— 组件那边会解码后当密钥用。
#     缺失时控制台对所有 /api 请求返回 503 并说明要配什么，而不是放行。
#   * `registrationCode` 只在「首次绑定 Touch ID」时用一次；绑定成功后该接口
#     会直接拒绝（409），所以它留在 Secret 里也不再是风险点。想更干净可绑定后删掉它。
#   * 换掉域名时，别忘了同时改 Deployment 里的 K3S_WASM_RP_ID / K3S_WASM_ORIGIN，
#     否则 WebAuthn 的 rpIdHash / origin 校验不过。
apiVersion: v1
kind: Secret
metadata:
  name: k3s-wasm-ui-auth-env
  namespace: k3s-wasm
  labels:
    app.kubernetes.io/part-of: k3s-wasm
    app.kubernetes.io/managed-by: k3s-wasm-ui
type: Opaque
stringData:
  # openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
  sessionSecret: "REPLACE_ME_base64url_32_bytes"
  # openssl rand -hex 16
  registrationCode: "REPLACE_ME_one_time_code"
