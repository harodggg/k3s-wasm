[package]
name = "k3s-wasm-ui"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "k3s WASM 控制台后端：编译为 wasm32-wasip2 的 wasi:http/proxy 组件"
publish = false

[lib]
# 组件必须是 cdylib：导出 wasi:http/incoming-handler
crate-type = ["cdylib"]

[dependencies]
# ⚠️ 这里刻意**不用** spin-sdk，用最底层的 wasi 绑定。原因是一个实测出来的坑：
#
#   组件模型里 wasi-http 的每个 0.2.x 补丁版本是**互不兼容**的独立包版本，
#   宿主只实现其中某几个。spin-sdk 5.2 经 wit-bindgen 生成的是 `@0.2.9`，
#   而 wasmtime 48 只实现 `@0.2.12`，于是直接报：
#     component imports instance `wasi:cli/environment@0.2.9`,
#     but a matching implementation was not found in the linker
#
#   `wasi`(wasip2) 的版本号后缀 `+wasi-0.2.12` 明确标出它生成的就是 0.2.12 ——
#   与宿主对齐。用底层绑定的另一个好处：组件里**没有任何 spin:* 导入**，
#   就是一个标准 wasi:http/proxy 组件，可以被任何合规宿主承载。
wasi = "0.14"

serde_json = "1"
# REALITY 的 X25519 密钥对生成（纯 Rust，wasip2 可用；xray-wasm 项目也用它验证过）
# 随机数不引入 getrandom/rand：直接用宿主提供的 wasi:random（见 api.rs 的 random_bytes）
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
# 把前端 dist 在编译期嵌进 wasm：运行时不需要文件系统能力。
include_dir = "0.7"

# ── 免密登录（WebAuthn / passkey）需要的密码学 ──
# 全部是纯 Rust，能编到 wasm32-wasip2；随机数仍然只用宿主给的 wasi:random。
#   p256  : 验 WebAuthn 断言的 ES256 签名（Touch ID 的凭据就是 P-256）
#   sha2  : rpIdHash / clientDataJSON 摘要
#   hmac  : 会话 cookie 与挑战 cookie 的签名（组件无状态，会话必须自带签名）
#   ciborium : 解析 attestationObject 与 COSE 公钥（CBOR）
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
hmac = "0.12"
ciborium = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
